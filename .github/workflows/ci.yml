name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke — syntax and structural guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: almotawakel-web
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: PHP syntax
        run: find app bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Python syntax
        run: python -m py_compile bin/*_ui.py bin/run_browser_verifiers.py bin/run_browser_suite.py
      - name: Safe verifier suite
        run: php bin/run_verifiers.php

  integration:
    name: Isolated MySQL and browser journeys
    runs-on: ubuntu-latest
    needs: smoke
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: almotawakel-web
    env:
      ALMOTAWAKEL_TEST_DB: almotawakel_test_ci_20260720
      ALMOTAWAKEL_E2E_URL: http://127.0.0.1:8795
      ALMOTAWAKEL_SKIP_NETWORK: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pcntl
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: almotawakel-web/requirements-test.txt
      - name: Create non-secret CI config
        run: |
          cp config/config.example.php config/config.php
          sed -i "s/'password' => 'CHANGE_ME'/'password' => 'ci-owner-password-2026'/" config/config.php
          sed -i "s/'enabled' => true/'enabled' => false/" config/config.php
      - name: Install isolated database
        run: php bin/install.php install
      - name: Isolated PHP verifier suite
        run: php bin/run_verifiers.php --profile=ci
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Browser journey suite
        run: python bin/run_browser_suite.py
      - name: Performance smoke budgets
        env:
          ALMOTAWAKEL_PERF: '1'
          ALMOTAWAKEL_PERF_SLOW_MS: '250'
        run: >-
          python bin/run_browser_suite.py --performance --samples=3
          --fixture-name=ci_journeys --assert-budgets
