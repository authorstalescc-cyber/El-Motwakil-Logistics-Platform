<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15355B">
<title>مفيش نت — المتوكل</title>
<style>
  /* ⚠️ الصفحة دي **مستقلة** — ما بتحمّلش app.css، فالخط لازم يتعلن هنا.
     الـService Worker بيكاش `/assets/` فالملف موجود أوفلاين. */
  @font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:swap;size-adjust:103%;
    src:url('fonts/cairo-arabic.woff2') format('woff2')}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center;
    background:linear-gradient(180deg,#15355B 0%,#0B1E38 100%);color:#F4F7FB;
    font-family:'Cairo',system-ui,-apple-system,Tahoma,Arial,sans-serif}
  .box{max-width:360px}
  .card{width:min(66vmin,300px);margin:0 auto 26px;padding:18px 22px;border-radius:34px;
    background:linear-gradient(180deg,#fff 0%,#EEF3F9 100%);box-shadow:0 18px 46px rgba(0,0,0,.42)}
  .card img{display:block;width:100%;height:auto}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{color:#B9C6D8;line-height:1.7;margin:0 0 22px}
  button{min-height:50px;padding:0 26px;border:0;border-radius:14px;cursor:pointer;
    background:#C9A227;color:#1A1405;font:inherit;font-weight:600;font-size:1rem}
  button:active{filter:brightness(.94)}
</style>
</head>
<body>
  <div class="box">
    <div class="card"><img src="/assets/img/logo.png" alt="المتوكل"></div>
    <h1>مفيش نت دلوقتي</h1>
    <p>النظام محتاج إنترنت عشان يجيب بياناتك. اتأكد من الاتصال وحاول تاني.</p>
    <button type="button" onclick="location.reload()">حاول تاني</button>
  </div>
</body>
</html>
