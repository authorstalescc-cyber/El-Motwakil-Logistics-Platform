<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F151E">
<title>مفيش نت — المتوكل</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    background:#0F151E;color:#F4F7FB;
    font-family:'Segoe UI','Tahoma',system-ui,-apple-system,Arial,sans-serif;text-align:center}
  .box{max-width:340px}
  .ic{font-size:3.4rem;margin-bottom:14px}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{color:#9AA9BC;line-height:1.7;margin:0 0 22px}
  button{min-height:50px;padding:0 26px;border:0;border-radius:14px;cursor:pointer;
    background:#D4AF37;color:#1A1405;font:inherit;font-weight:800;font-size:1rem}
  button:active{filter:brightness(.94)}
</style>
</head>
<body>
  <div class="box">
    <div class="ic">📡</div>
    <h1>مفيش نت دلوقتي</h1>
    <p>اتأكد من الإنترنت وحاول تاني. شغلك المحفوظ في المسودة مش هيضيع.</p>
    <button type="button" onclick="location.reload()">حاول تاني</button>
  </div>
</body>
</html>
